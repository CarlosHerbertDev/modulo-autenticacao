services:

  php:
    build:
      context: .
      target: prod
    image: pague-ai:prod
    restart: unless-stopped
    environment:
      PORT: 80
      APP_NAME: pague-ai-backend
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?defina APP_KEY no .env ao lado deste arquivo}
      APP_URL: ${APP_URL:?defina APP_URL}
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - app_storage:/var/www/html/storage/app/public
    ports:
      - "127.0.0.1:8099:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  app_storage:
