services:

  php:
    build:
      context: .
      target: dev
    container_name: pague-ai-backend
    volumes:
      - ./src:/var/www/html
    ports:
      - "8099:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mysql_pague-ai_backend
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pague-ai
      MYSQL_USER: pague-ai
      MYSQL_PASSWORD: 123
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_pague-ai_backend
    environment:
      PMA_HOST: db
    ports:
      - "8098:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
